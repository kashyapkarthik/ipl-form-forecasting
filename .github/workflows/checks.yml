name: Research checks
on: [push, pull_request]
jobs:
  tests-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python pipeline.py
      - run: python -m pytest -q
